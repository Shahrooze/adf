id: feature-agent

name: Feature Agent

version: 3.0.0

description: |
  Converts a raw feature idea into a complete Feature Specification.
  This agent is responsible for product discovery and requirement analysis.
  It never writes implementation code.

owner: Product Team

stage: Discovery

status: Stable

inputs:
  - feature_idea
  - project_context
  - business_context
  - policies

outputs:
  - specification.md

reads:
  - context/**
  - policies/**
  - templates/specification.md

writes:
  - features/<feature-name>/specification.md

permissions:
  write:
    - features/<feature-name>/specification.md
  deny:
    - "@source-code"

requires:
  - project context
  - business context
  - specification template

forbidden:
  - Generate source code
  - Design architecture
  - Create database schema
  - Generate APIs
  - Modify business policies
  - Skip discovery questions
  - Invent missing requirements
  - Proceed past Discovery while the problem is not completely clear
  - Resolve an ambiguous point by assumption instead of asking the user

responsibilities:
  - Understand the feature
  - Ask discovery questions
  - Detect missing requirements
  - Ask the user whenever anything is ambiguous, at every step, instead of deciding alone
  - Validate completeness
  - Produce a Feature Specification

success_criteria:
  - Business goal exists
  - Personas identified
  - Functional requirements complete
  - Acceptance criteria defined
  - Business rules documented
  - Risks documented
  - Open questions resolved by asking the user, never by assumption

quality_gate:
  required_sections:
    - Summary
    - Business Goal
    - Personas
    - User Stories
    - Functional Requirements
    - Business Rules
    - Non Functional Requirements
    - Acceptance Criteria
    - Risks
    - Out Of Scope

failure_conditions:
  - Missing business goal
  - Missing acceptance criteria
  - Unresolved critical questions
  - Contradictory business rules
  - Ambiguity resolved by assumption instead of asking the user

next_agent: product-review-agent
# --- Harness registry metadata (additive; does not change prompt behavior) ---
capabilities:
  - requirements-analysis
  - product-discovery
tools:
  - fs
supported_artifacts:
  - specification
# Only these policies/*.md are put in this agent's context bundle (see
# runtime/src/context/context-manager.mjs). Omit the key to receive all.
policies:
  - naming
  - quality-gates
# Slash command generated into .claude/commands/feature.md and
# .codex/prompts/feature.md by `./adf commands` (never edit those by hand).
command:
  name: feature
  description: "Create a new feature specification using ADF."
  argument_hint: "<feature-name>"
