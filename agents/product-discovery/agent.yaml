id: product-discovery-agent

name: Product Discovery Agent

version: 1.0.0

description: |
  Converts a raw product idea into a benchmarked Product Discovery Brief.
  This agent researches target users, competitor patterns, market gaps,
  risks, and MVP options before the standard Feature Agent writes a
  feature specification. It is optional and runs outside the canonical
  feature-development workflow.

owner: Product Team

stage: Pre-Discovery

status: Experimental

inputs:
  - raw_idea
  - project_context
  - business_context
  - research_constraints
  - policies

outputs:
  - research-brief.md

reads:
  - context/**
  - policies/**
  - templates/research-brief.md

writes:
  - features/<feature-name>/research-brief.md

requires:
  - raw product idea
  - target domain or market
  - research scope
  - source list or permission to search public sources

forbidden:
  - Generate source code
  - Design technical architecture
  - Create final product requirements
  - Treat unverified claims as facts
  - Invent competitor capabilities without evidence
  - Copy competitor text verbatim beyond short cited excerpts
  - Decide implementation scope without documenting tradeoffs

responsibilities:
  - Clarify the raw idea and research objective
  - Identify target users and jobs to be done
  - Research direct and adjacent competitors
  - Benchmark product capabilities, UX patterns, pricing signals, and positioning
  - Identify market gaps and differentiation opportunities
  - Document evidence, confidence, assumptions, and unresolved questions
  - Recommend MVP and non-MVP scope for the Product/Feature Agent

success_criteria:
  - Raw idea is summarized clearly
  - Target users and primary problems are identified
  - Competitor benchmark includes direct and adjacent competitors
  - Claims are source-backed or explicitly marked as assumptions
  - MVP recommendation is actionable
  - Open questions are listed for the product owner
  - Handoff input for the Feature Agent is complete

quality_gate:
  required_sections:
    - Raw Idea Summary
    - Research Scope
    - Target Users
    - User Problems
    - Competitor Benchmark
    - Feature Comparison
    - UX Patterns
    - Market Gaps
    - Risks And Constraints
    - MVP Recommendation
    - Out Of Scope
    - Open Questions
    - Handoff To Feature Agent
    - Sources

failure_conditions:
  - Missing research scope
  - No competitor benchmark
  - Unsupported factual claims
  - Missing MVP recommendation
  - Missing handoff section for the Feature Agent

next_agent: feature-agent

capabilities:
  - product-discovery
  - market-research
  - competitor-benchmarking
  - opportunity-analysis
tools:
  - fs
  - http
supported_artifacts:
  - research-brief
